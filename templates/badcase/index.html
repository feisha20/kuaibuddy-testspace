<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badcase 清单</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f3;color:#20332a;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select{font:inherit}button,.file{border:1px solid #dae4dc;border-radius:7px;padding:8px 12px;background:white;color:#304b3b;cursor:pointer;font-weight:600}button:hover,.file:hover{background:#edf5ef}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #95cdb0}header{padding:16px 26px;background:white;border-bottom:1px solid #dfe8e0;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:17px}.logo{display:inline-grid;place-items:center;background:#164c38;color:white;width:34px;height:34px;border-radius:9px;margin-right:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:#184c39;color:white}.primary:hover{background:#23664c}.wrap{max-width:1500px;margin:auto;padding:24px 26px}.headline{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}h1{font-size:23px;margin:0 0 6px}small,.muted{color:#829187;font-size:12px}.stats{display:flex;gap:8px}.stat{background:white;border:1px solid #e0e8e1;border-radius:8px;padding:9px 14px;color:#708076;white-space:nowrap}.stat b{font-size:17px;color:#203a2d}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px}.panel{background:#fff;border:1px solid #dfe7e0;border-radius:10px;overflow:hidden}.filter{padding:14px;border-bottom:1px solid #e8eee9}.filter input{width:100%;padding:10px;border:1px solid #dce5dd;border-radius:7px}.row{display:flex;gap:7px;margin-top:8px}.row select{width:50%;padding:8px;border:1px solid #dce5dd;border-radius:7px;background:#fff;color:#52675a}.list{max-height:calc(100vh - 245px);overflow:auto}.item{border:0;border-left:3px solid transparent;border-bottom:1px solid #edf1ed;border-radius:0;display:block;width:100%;text-align:left;padding:14px;background:white}.item.active{border-left-color:#28845e;background:#f1f8f3}.item-title{font-weight:700;margin:8px 0}.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#7c8d81}.badge{background:#edf4ee;color:#527461;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:700}.P1,.P0{background:#fff0e9;color:#b55b34}.P2{background:#fff6dc;color:#8f6c1c}.detail{min-height:570px}.head,.section{padding:19px 24px;border-bottom:1px solid #edf1ed}.head h2{font-size:21px;margin:11px 0}.section h3{font-size:13px;margin:0 0 10px;color:#274b38}.section h3:before{content:'';display:inline-block;width:3px;height:13px;background:#388867;margin-right:8px;vertical-align:-2px}.text,.quote,.notice{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}.quote{background:#f5f8f5;border:1px solid #e5ece6;padding:12px;border-radius:7px}.notice{background:#fff9e9;padding:12px;border-radius:7px;color:#705c2d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field{background:#f6f9f6;padding:10px;border-radius:6px}.field small{display:block;margin-bottom:6px}.timeline{list-style:none;padding:0;margin:0}.timeline li{margin-left:4px;padding:0 0 16px 20px;border-left:1px solid #d8e8dc;position:relative}.timeline li:last-child{border-color:transparent;padding-bottom:0}.timeline li:before{content:'';position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:#64a380;border:2px solid white}.time{font-size:12px;color:#87998d;margin-bottom:5px}summary{color:#41845c;cursor:pointer;font-size:12px;margin-top:7px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f4;padding:10px;border-radius:6px}.empty{padding:40px;text-align:center;color:#84958a}.toast{position:fixed;bottom:20px;right:20px;background:#183d2e;color:white;padding:10px 14px;border-radius:7px;display:none}@media(max-width:760px){header{padding:14px;align-items:start}.wrap{padding:16px 14px}.layout{grid-template-columns:1fr}.headline{flex-direction:column;align-items:start}.list{max-height:230px}.grid{grid-template-columns:1fr}.head,.section{padding:16px}}@media print{header,.filter,.list,.stats{display:none}.layout{display:block}.panel{border:0}}
</style><header><div><span class="logo">B</span><strong>Badcase 案例清单</strong></div><div class="actions"><button id="reset">恢复示例</button><label class="file">导入 JSON<input id="file" type="file" accept=".json,application/json" hidden></label><button class="primary" id="copy">复制 Bug 描述</button></div></header><main class="wrap"><div class="headline"><div><h1 id="title"></h1><div class="muted" id="reportMeta"></div></div><div class="stats" id="stats"></div></div><div class="layout"><aside class="panel"><div class="filter"><input id="search" type="search" placeholder="搜索案例、提示词、Run ID" aria-label="搜索案例"><div class="row"><select id="priority" aria-label="优先级筛选"></select><select id="type" aria-label="类型筛选"></select></div></div><div class="list" id="list"></div></aside><article class="panel detail" id="detail"></article></div></main><div class="toast" role="status" id="toast"></div><script>
const example={title:'对话质量分析 · 示例报告',environment:'示例环境',period:'2026-11-01',timezone:'Asia/Shanghai',note:'所有案例均为虚构示例',cases:[{id:'BC-01',title:'天气查询结果未交付',priority:'P1',type:'任务未完成',status:'待核实',prompt:'查询今天的天气，并将结果发送给我。',description:'助手已查询到天气数据，但后续推送受阻，最终未向用户返回已获取的天气信息。',startTime:'2026-11-01 09:00:00',endTime:'2026-11-01 09:03:20',duration:'3 分 20 秒（可见消息跨度）',runId:'demo-run-001',sessionId:'demo-session-001',timeline:[{time:'09:00:00',step:'收到用户天气查询与推送请求。'},{time:'09:00:18',step:'查询天气并获取天气数据。',tool:'运行命令 / weather-cli',command:'weather-cli forecast --city 示例城市',result:'返回天气数据。'},{time:'09:02:51',step:'尝试发送结果，工具返回授权不足。',tool:'消息发送工具',result:'授权不足。'},{time:'09:03:20',step:'助手结束本轮，未汇报已获取的天气数据。'}],cause:'已确认：推送工具返回授权不足。待验证：天气结果未交付的具体决策原因。',evidence:'消息与工具结果记录；服务端 trace 尚未获取。',suggestion:'先返回已获得的天气结果，再说明推送受阻和所需授权。'},{id:'BC-02',title:'统计口径说明不一致',priority:'P2',type:'回答质量',status:'待复核',prompt:'统计昨日客户回复率，并说明计算方式。',description:'答复中的回复率超过 100%，但未解释分子和分母使用了不同客户集合，容易造成误读。',startTime:'2026-11-01 10:00:00',endTime:'2026-11-01 10:01:12',duration:'1 分 12 秒（可见消息跨度）',runId:'demo-run-002',sessionId:'demo-session-002',timeline:[{time:'10:00:00',step:'收到统计请求。'},{time:'10:00:35',step:'获取客户触达及回复数据。',tool:'数据查询工具'},{time:'10:01:12',step:'生成报告，回复率和口径解释不一致。'}],cause:'待验证：计算使用了不同客户集合，但答复未说明。',evidence:'助手答复和统计结果；客户级明细未取得。',suggestion:'明确分子、分母和去重口径。'}]};let report=example,selected='BC-01';const $=x=>document.getElementById(x),v=(x,d='未提供')=>x===undefined||x===null||x===''?d:String(x),h=x=>v(x,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}function options(){for(const [id,key,label] of [['priority','priority','全部优先级'],['type','type','全部类型']]){$(id).innerHTML='<option value="">'+label+'</option>'+[...new Set(report.cases.map(c=>c[key]).filter(Boolean))].sort().map(x=>`<option value="${h(x)}">${h(x)}</option>`).join('')}}function filtered(){const q=$('search').value.trim().toLowerCase();return report.cases.filter(c=>(!$('priority').value||c.priority===$('priority').value)&&(!$('type').value||c.type===$('type').value)&&(!q||JSON.stringify(c).toLowerCase().includes(q)))}function render(){let cs=filtered();if(!cs.some(c=>c.id===selected))selected=cs[0]?.id;$('title').textContent=v(report.title,'Badcase 分析报告');$('reportMeta').textContent=[report.environment,report.period,report.timezone,report.note].filter(Boolean).join(' · ');$('stats').innerHTML=`<div class="stat"><b>${report.cases.length}</b> 案例总数</div><div class="stat"><b>${cs.length}</b> 当前结果</div><div class="stat"><b>${report.cases.filter(c=>['P0','P1'].includes(c.priority)).length}</b> P0 / P1</div>`;$('list').innerHTML=cs.length?cs.map(c=>`<button class="item ${c.id===selected?'active':''}" data-id="${h(c.id)}" aria-pressed="${c.id===selected}"><div class="meta"><span>${h(c.id)}</span><span class="badge ${h(c.priority)}">${h(v(c.priority,'待定'))}</span></div><div class="item-title">${h(v(c.title))}</div><div class="meta"><span>${h(v(c.type,'未分类'))}</span><span>${h(v(c.status,'待核实'))}</span></div></button>`).join(''):'<div class="empty">没有匹配的案例</div>';$('list').querySelectorAll('.item').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});let c=cs.find(x=>x.id===selected);if(!c){$('detail').innerHTML='<div class="empty">调整筛选条件后查看案例</div>';return}let steps=Array.isArray(c.timeline)?c.timeline:[];$('detail').innerHTML=`<div class="head"><span class="badge ${h(c.priority)}">${h(v(c.priority,'待定'))}</span> <span class="badge">${h(v(c.type,'未分类'))}</span> <span class="muted">${h(c.id)} / ${h(v(c.status,'待核实'))}</span><h2>${h(v(c.title))}</h2><div class="muted">Run ID：${h(v(c.runId))}　·　会话：${h(v(c.sessionId))}</div></div><section class="section"><h3>问题描述</h3><div class="text">${h(v(c.description))}</div></section><section class="section"><h3>客户提示词</h3><div class="quote">${h(v(c.prompt))}</div></section><section class="section"><h3>执行时间</h3><div class="grid"><div class="field"><small>开始时间</small>${h(v(c.startTime))}</div><div class="field"><small>最后可见时间</small>${h(v(c.endTime))}</div><div class="field"><small>可见时间跨度</small>${h(v(c.duration))}</div></div></section><section class="section"><h3>执行步骤与时间线</h3>${steps.length?'<ol class="timeline">'+steps.map(x=>`<li><div class="time">${h(v(x.time,'时间未知'))}</div><div class="text">${h(v(x.step))}</div>${x.tool?`<div class="muted">工具：${h(x.tool)}</div>`:''}${x.command||x.result?`<details><summary>查看命令与结果</summary>${x.command?`<pre>${h(x.command)}</pre>`:''}${x.result?`<pre>${h(x.result)}</pre>`:''}</details>`:''}</li>`).join('')+'</ol>':'<div class="muted">暂无可见执行步骤</div>'}</section><section class="section"><h3>核心原因与待验证项</h3><div class="notice">${h(v(c.cause))}</div></section><section class="section"><h3>证据与建议</h3><div class="text"><b>证据：</b>${h(v(c.evidence))}\n<b>建议：</b>${h(v(c.suggestion))}</div></section><div class="section muted">事实、推断和缺失证据请分别填写；可见时间跨度不等同于服务端执行耗时。</div>`}function bug(c){return [`【${v(c.id)}】${v(c.title)}`,`优先级：${v(c.priority)}　类型：${v(c.type)}`,`问题描述：${v(c.description)}`,`客户提示词：${v(c.prompt)}`,`执行时间：${v(c.startTime)} 至 ${v(c.endTime)}；${v(c.duration)}`,`Run ID：${v(c.runId)}　会话：${v(c.sessionId)}`,'执行步骤：',...(Array.isArray(c.timeline)?c.timeline:[]).map((x,i)=>`${i+1}. ${v(x.time,'时间未知')} ${v(x.step)}${x.tool?'（'+x.tool+'）':''}${x.command?'\n命令：'+x.command:''}${x.result?'\n结果：'+x.result:''}`),`核心原因与待验证项：${v(c.cause)}`,`证据：${v(c.evidence)}`,`建议：${v(c.suggestion)}`].join('\n')}$('copy').onclick=async()=>{let c=report.cases.find(x=>x.id===selected);if(!c)return toast('请先选择案例');let t=bug(c);try{await navigator.clipboard.writeText(t);toast('已复制 Bug 描述')}catch{let a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.left='-9999px';document.body.appendChild(a);a.select();let ok=document.execCommand('copy');a.remove();toast(ok?'已复制 Bug 描述':'复制失败，请手动选择内容')}};$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!d||!Array.isArray(d.cases)||d.cases.some(c=>!c||typeof c.id!=='string'||!c.id.trim())||new Set(d.cases.map(c=>c.id)).size!==d.cases.length)throw Error('cases 中每条 id 必须非空且唯一');report=d;selected=d.cases[0]?.id;$('search').value='';options();render();toast(`已导入 ${d.cases.length} 条案例`)}catch(err){toast('导入失败：'+err.message)}e.target.value=''};$('reset').onclick=()=>{report=example;selected='BC-01';$('search').value='';options();render();toast('已恢复虚构示例')};['search','priority','type'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));options();render();
</script></html>
